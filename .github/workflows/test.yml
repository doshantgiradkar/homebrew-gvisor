name: test

on:
  push:
  pull_request:

jobs:
  ruby-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Ruby syntax check
        run: ruby -c Formula/gvisor.rb

  formula-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trust tap, install formula, and audit
        run: |
          set -euo pipefail
          brew trust doshantgiradkar/gvisor
          brew install --formula doshantgiradkar/gvisor/gvisor
          brew audit --strict doshantgiradkar/gvisor/gvisor

  formula-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trust tap, install formula, and run test block
        run: |
          set -euo pipefail
          brew trust doshantgiradkar/gvisor
          brew install --formula doshantgiradkar/gvisor/gvisor
          brew test doshantgiradkar/gvisor/gvisor

name: update-formula

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest stable gVisor release
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: 'google',
              repo: 'gvisor',
              per_page: 100,
            });

            const stable = releases.find(r => !r.prerelease && r.tag_name.startsWith('release-'));
            if (!stable) {
              core.setFailed('No stable release found');
              return;
            }

            core.setOutput('tag', stable.tag_name);
            core.setOutput('version', stable.tag_name.replace('release-', ''));

      - name: Check if formula needs update
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('Formula/gvisor.rb', 'utf8');
            const m = content.match(/version\s+\"([^\"]+)\"/);
            if (!m) throw new Error('Could not find version in Formula/gvisor.rb');
            core.setOutput('version', m[1]);

      - name: Download artifacts and prepare PR (implementation placeholder)
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          echo "Update automation not implemented in this initial step."

      - name: No update
        if: steps.latest.outputs.version == steps.current.outputs.version
        run: echo "No update available"
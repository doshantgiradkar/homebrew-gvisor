name: update-formula

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest stable gVisor release
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: "google",
              repo: "gvisor",
              per_page: 100,
            });

            const release = releases.find(r =>
              !r.draft &&
              !r.prerelease &&
              /^release-\d{8}\.\d+$/.test(r.tag_name)
            );

            if (!release) {
              core.setFailed("No stable gVisor release found");
              return;
            }

            core.setOutput("tag", release.tag_name);
            core.setOutput("version", release.tag_name.replace(/^release-/, ""));

      - name: Update formula version, URLs, and checksums
        id: update
        env:
          RELEASE_TAG: ${{ steps.latest.outputs.tag }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail

          current_version="$(sed -nE 's/^  version \"([^\"]+)\"$/\1/p' Formula/gvisor.rb)"
          if [[ "$current_version" == "$VERSION" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Formula is already at gVisor $VERSION"
            exit 0
          fi

          curl --fail --silent --show-error --location \
            "https://github.com/google/gvisor/releases/download/${RELEASE_TAG}/SHA256SUMS" \
            --output /tmp/gvisor-SHA256SUMS

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          checksums = {}
          for line in Path("/tmp/gvisor-SHA256SUMS").read_text().splitlines():
              fields = line.split()
              if len(fields) >= 2:
                  checksums[fields[-1].lstrip("*")] = fields[0].lower()

          artifact_names = ("gvisor-x86_64.tar.bz2", "gvisor-aarch64.tar.bz2")
          for name in artifact_names:
              digest = checksums.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit(f"Missing valid upstream SHA-256 for {name}")

          formula = Path("Formula/gvisor.rb")
          text = formula.read_text()
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["VERSION"]

          replacements = [
              (r'(?m)^(  url "https://github\.com/google/gvisor/releases/download/)release-[^/]+(/gvisor-x86_64\.tar\.bz2")$', rf'\g<1>{tag}\g<2>'),
              (r'(?m)^(      url "https://github\.com/google/gvisor/releases/download/)release-[^/]+(/gvisor-aarch64\.tar\.bz2")$', rf'\g<1>{tag}\g<2>'),
              (r'(?m)^  version "[^"]+"$', f'  version "{version}"'),
              (r'(?m)^  sha256 "[0-9a-fA-F]{64}"$', f'  sha256 "{checksums[artifact_names[0]]}"'),
              (r'(?m)^      sha256 "[0-9a-fA-F]{64}"$', f'      sha256 "{checksums[artifact_names[1]]}"'),
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Formula structure did not match expected pattern: {pattern}")

          formula.write_text(text)
          PY

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Homebrew
        if: steps.update.outputs.changed == 'true'
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit, install, and test updated formula
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --prefix)/Homebrew/Library/Taps/doshantgiradkar/homebrew-gvisor"
          mkdir -p "$(dirname "$TAP_DIR")"
          rm -rf "$TAP_DIR"
          mkdir -p "$TAP_DIR"
          rsync -a --delete ./ "$TAP_DIR/"
          cd "$TAP_DIR"
          brew trust doshantgiradkar/gvisor
          brew install --formula doshantgiradkar/gvisor/gvisor
          brew audit --strict doshantgiradkar/gvisor/gvisor
          brew test doshantgiradkar/gvisor/gvisor

      - name: Create or update formula PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-gvisor-formula
          delete-branch: true
          commit-message: "Update gVisor to ${{ steps.latest.outputs.version }}"
          title: "Update gVisor to ${{ steps.latest.outputs.version }}"
          body: |
            Updates the gVisor formula to the latest stable upstream release.

            The version, download URLs, and SHA-256 checksums come from Google's release tag and SHA256SUMS file. The updater runs Homebrew audit, install, and formula tests before opening this PR.
